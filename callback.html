<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok OAuth Callback — AstraPromos</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 680px; margin: 48px auto; padding: 0 20px; color: #18181b; line-height: 1.6; }
    code { display: block; background: #f4f4f5; padding: 12px; border-radius: 8px; word-break: break-all; margin: 12px 0; }
    .btn { display: inline-block; background: #2563eb; color: #fff; padding: 10px 16px; border-radius: 8px; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <h1>TikTok Authorization Received</h1>
  <p id="status">Checking authorization parameters...</p>
  <code id="code-box" style="display:none;"></code>
  <a id="local-link" class="btn" style="display:none;" href="#">Continue to AstraPromos Dashboard</a>
  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    const err = params.get("error");
    const status = document.getElementById("status");
    const codeBox = document.getElementById("code-box");
    const localLink = document.getElementById("local-link");
    if (err) {
      status.textContent = "Authorization error: " + (params.get("error_description") || err);
    } else if (code) {
      status.textContent = "Authorization code received successfully:";
      codeBox.textContent = code;
      codeBox.style.display = "block";
      localLink.href = "http://localhost:28420/api/tiktok/callback" + window.location.search;
      localLink.style.display = "inline-block";
    } else {
      status.textContent = "Ready to receive TikTok OAuth2 callback.";
    }
  </script>
</body>
</html>
